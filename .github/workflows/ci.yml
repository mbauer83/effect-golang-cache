name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One checkout. go.mod requires the runtime by version, so this job
      # resolves it the way anyone depending on this module does -- which is
      # the point of running it: a green run says the published dependency is
      # enough to build and test this commit. A workspace would resolve it to
      # whatever is checked out beside it and say nothing.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run always reflects
      # the commit it ran on. -coverpkg is needed because the suite lives
      # outside the package it exercises.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      # Both adapters exist to be shared, so what they do under concurrent use
      # is the property worth establishing rather than assuming.
      - name: Race
        run: go test -race -count=1 ./...

      # Every Gen body rewritten into a FlatMap chain must behave exactly as
      # written, so the suites run again on the rewritten source.
      - name: Race, rewritten
        run: go tool effectgo test -race -count=1 ./...

  # What this module is for is two Lua scripts, and the suite above runs them
  # on gopher-lua inside a fake. That fake is worth having -- it lets a test
  # hold the clock, which a rate measured in seconds otherwise makes it wait
  # for -- but it is not Redis, and a script that behaves there and not on a
  # server would be a defect nothing here could see.
  #
  # So the cases that need no clock control run again against a real server,
  # and this job is where their evidence comes from. A separate job, so a
  # server that will not start blocks this and not the suite that needs
  # nothing.
  server:
    runs-on: ubuntu-latest
    services:
      valkey:
        # Valkey rather than Redis, because that is what the adapter's own
        # documentation says it serves unchanged -- so this is the claim as
        # well as the coverage.
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      # -run names them, so the job says what it established rather than
      # running the whole suite again with one variable set. A case gated on
      # an address that this list does not name runs nowhere.
      - name: Against a real server
        env:
          EFFECT_GOLANG_REDIS_URL: redis://127.0.0.1:6379/0
        run: >-
          go test -count=1 -v
          -run 'OnARealServer'
          ./test/acceptance/
